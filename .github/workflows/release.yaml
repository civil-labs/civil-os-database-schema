name: Build Migration Artifact
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semantic version bump or tag suffix'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - manual
      custom_tag:
        description: 'Custom tag (if manual chosen above)'
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Image Tag
        id: tagger
        run: |
          git fetch --tags --force

          # Shorten the commit SHA
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          # Handle manual push of a git tag (e.g., git push origin v1.0.0)
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Handle manual text input override
          if [ "${{ inputs.bump }}" = "manual" ]; then
            echo "tag=${{ inputs.custom_tag }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Resolve the latest semver tag, stripping non-semver suffixes
          RAW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          CLEAN_TAG=$(echo "${RAW_TAG}" | sed -E 's/^v//; s/-.*$//')

          IFS='.' read -r MAJOR MINOR PATCH <<< "${CLEAN_TAG}"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          case "${{ inputs.bump }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          # Choose format: Pure SemVer (v0.1.0) or SemVer with commit metadata (v0.1.0-d64e891)
          SEMVER="v${MAJOR}.${MINOR}.${PATCH}"
          FULL_TAG="${SEMVER}-${SHORT_SHA}"

          echo "tag=${FULL_TAG}" >> $GITHUB_OUTPUT
          echo "semver=${SEMVER}" >> $GITHUB_OUTPUT
          echo "Calculated tag: ${FULL_TAG} (Base semver: ${SEMVER})"

      # Automatically tag the commit so the next build increments from this version
      - name: Create and Push Git Tag
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'manual'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.tagger.outputs.semver }}" -m "Release ${{ steps.tagger.outputs.tag }}"
          git push origin "${{ steps.tagger.outputs.semver }}"