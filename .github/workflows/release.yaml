name: Build Migration Artifact
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semantic version bump or tag suffix'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - manual
      custom_tag:
        description: 'Custom tag (if manual chosen above)'
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Image Tag
        id: tagger
        run: |
          git fetch --tags --force 2>/dev/null || true

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          # 1. Handle explicit Git tag push
          if [ "${{ github.event_name }}" = "push" ]; then
            CLEAN_PUSH_TAG="${GITHUB_REF_NAME#v}"
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "semver=v${CLEAN_PUSH_TAG}" >> $GITHUB_OUTPUT
            echo "cm_tag=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr '_' '-')" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2. Handle manual text override
          if [ "${{ inputs.bump }}" = "manual" ]; then
            CUSTOM="${{ inputs.custom_tag }}"
            echo "tag=${CUSTOM}" >> $GITHUB_OUTPUT
            echo "semver=${CUSTOM}" >> $GITHUB_OUTPUT
            echo "cm_tag=$(echo "${CUSTOM}" | tr '[:upper:]' '[:lower:]' | tr '_' '-')" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 3. Robust tag discovery: fetch latest semantic tag
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi

          # Strip 'v' and any trailing hyphen/metadata for calculation
          CLEAN_TAG=$(echo "${LATEST_TAG}" | sed -E 's/^v//; s/-.*$//')

          IFS='.' read -r MAJOR MINOR PATCH <<< "${CLEAN_TAG}"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          case "${{ inputs.bump }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          SEMVER="v${MAJOR}.${MINOR}.${PATCH}"
          FULL_TAG="${SEMVER}-${SHORT_SHA}"

          echo "tag=${FULL_TAG}" >> $GITHUB_OUTPUT
          echo "semver=${SEMVER}" >> $GITHUB_OUTPUT
          echo "cm_tag=$(echo "${FULL_TAG}" | tr '[:upper:]' '[:lower:]' | tr '_' '-')" >> $GITHUB_OUTPUT
          echo "Calculated tag: ${FULL_TAG} (Base semver: ${SEMVER})"

      # Automatically tag the commit so subsequent runs increment from this version
      - name: Create and Push Git Tag
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'manual'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.tagger.outputs.semver }}" -m "Release ${{ steps.tagger.outputs.tag }}"
          git push origin "${{ steps.tagger.outputs.semver }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Migration Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # ghcr.io repository paths must always be lowercased
          tags: |
            ghcr.io/${{ github.repository_owner }}/civil-db-migrations:${{ steps.tagger.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/civil-db-migrations:latest

      # Output Kustomize/ConfigMap manifests
      - name: Generate ConfigMap Manifest Artifact
        run: |
          mkdir -p dist
          kubectl create configmap civil-db-migrations-${{ steps.tagger.outputs.cm_tag }} \
            --from-file=migrations/ \
            --dry-run=client -o yaml > dist/migration-configmap.yaml