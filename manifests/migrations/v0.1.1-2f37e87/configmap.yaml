  20261102223511.sql: "-- Add new schema named \"extensions\"\nCREATE SCHEMA \"extensions\";\n--
    Set comment to schema: \"extensions\"\nCOMMENT ON SCHEMA \"extensions\" IS 'schema
    for isolated extensions';\n-- Create extension \"postgis\"\nCREATE EXTENSION \"postgis\"
    WITH SCHEMA \"extensions\" VERSION \"3.6.4\";\n-- Create extension \"pgcrypto\"\nCREATE
    EXTENSION \"pgcrypto\" WITH SCHEMA \"extensions\" VERSION \"1.4\";\n-- Create
    extension \"btree_gist\"\nCREATE EXTENSION \"btree_gist\" WITH SCHEMA \"extensions\"
    VERSION \"1.7\";\n-- Set comment to schema: \"public\"\nCOMMENT ON SCHEMA \"public\"
    IS 'default postgres schema (locked down)';\n-- Add new schema named \"core\"\nCREATE
    SCHEMA \"core\";\n-- Set comment to schema: \"core\"\nCOMMENT ON SCHEMA \"core\"
    IS 'schema for relational data and audit';\n-- Add new schema named \"geo\"\nCREATE
    SCHEMA \"geo\";\n-- Set comment to schema: \"geo\"\nCOMMENT ON SCHEMA \"geo\"
    IS 'schema for heavy spatial data';\n-- Create \"parcels\" table\nCREATE TABLE
    \"core\".\"parcels\" (\n  \"parcel_id\" bigint NOT NULL GENERATED ALWAYS AS IDENTITY,\n
    \ \"public_id\" uuid NOT NULL DEFAULT gen_random_uuid(),\n  \"legacy_id\" text
    NULL,\n  \"is_voided\" boolean NOT NULL DEFAULT false,\n  \"voided_at\" timestamptz
    NULL,\n  \"system_updated_at\" timestamptz NOT NULL DEFAULT now(),\n  \"trace_id\"
    character varying(32) NOT NULL,\n  PRIMARY KEY (\"parcel_id\"),\n  CONSTRAINT
    \"chk_voided_logic\" CHECK (((is_voided = false) AND (voided_at IS NULL)) OR ((is_voided
    = true) AND (voided_at IS NOT NULL)))\n);\n-- Create index \"idx_parcels_legacy_id\"
    to table: \"parcels\"\nCREATE UNIQUE INDEX \"idx_parcels_legacy_id\" ON \"core\".\"parcels\"
    (\"legacy_id\");\n-- Create index \"idx_parcels_public_id\" to table: \"parcels\"\nCREATE
    UNIQUE INDEX \"idx_parcels_public_id\" ON \"core\".\"parcels\" (\"public_id\");\n--
    Create \"generate_secure_mvt_id\" function\nCREATE FUNCTION \"geo\".\"generate_secure_mvt_id\"
    () RETURNS bigint LANGUAGE plpgsql PARALLEL SAFE AS $$\nDECLARE\n    b bytea :=
    gen_random_bytes(7);\n    res bigint := 0;\nBEGIN\n    res := (get_byte(b, 0)::bigint
    << 48) |\n           (get_byte(b, 1)::bigint << 40) |\n           (get_byte(b,
    2)::bigint << 32) |\n           (get_byte(b, 3)::bigint << 24) |\n           (get_byte(b,
    4)::bigint << 16) |\n           (get_byte(b, 5)::bigint << 8) |\n           (get_byte(b,
    6)::bigint);\n               \n    RETURN GREATEST(1, res & 9007199254740991);\nEND;\n$$;\n--
    Create \"parcel_geometry\" table\nCREATE TABLE \"geo\".\"parcel_geometry\" (\n
    \ \"parcel_geometry_id\" bigint NOT NULL GENERATED ALWAYS AS IDENTITY,\n  \"parcel_id\"
    bigint NOT NULL,\n  \"feature_id\" bigint NOT NULL DEFAULT geo.generate_secure_mvt_id(),\n
    \ \"geom_web\" extensions.geometry(MultiPolygon,4326) NOT NULL,\n  \"geom_legal\"
    extensions.geometry(MultiPolygon) NULL,\n  \"local_srid\" integer NULL,\n  \"legal_valid_range\"
    tstzrange NOT NULL,\n  \"system_updated_at\" timestamptz NOT NULL DEFAULT now(),\n
    \ \"trace_id\" character varying(32) NOT NULL,\n  PRIMARY KEY (\"parcel_geometry_id\"),\n
    \ CONSTRAINT \"no_overlapping_feature_id\" EXCLUDE USING GIST (\"feature_id\"
    WITH =, \"legal_valid_range\" WITH &&),\n  CONSTRAINT \"no_overlapping_parcel_geometry\"
    EXCLUDE USING GIST (\"parcel_id\" WITH =, \"legal_valid_range\" WITH &&),\n  CONSTRAINT
    \"fk_parcel_id\" FOREIGN KEY (\"parcel_id\") REFERENCES \"core\".\"parcels\" (\"parcel_id\")
    ON UPDATE NO ACTION ON DELETE RESTRICT\n);\n-- Create index \"idx_geom_web_parcel_geometry\"
    to table: \"parcel_geometry\"\nCREATE INDEX \"idx_geom_web_parcel_geometry\" ON
    \"geo\".\"parcel_geometry\" USING GIST (\"geom_web\");\n-- Create index \"idx_parcel_geometry_feature_id\"
    to table: \"parcel_geometry\"\nCREATE INDEX \"idx_parcel_geometry_feature_id\"
    ON \"geo\".\"parcel_geometry\" (\"feature_id\");\n-- Create index \"idx_parcel_geometry_parcel_id\"
    to table: \"parcel_geometry\"\nCREATE INDEX \"idx_parcel_geometry_parcel_id\"
    ON \"geo\".\"parcel_geometry\" (\"parcel_id\");\n-- Create \"get_parcel_tiles\"
    function\nCREATE FUNCTION \"core\".\"get_parcel_tiles\" (\"z\" integer, \"x\"
    integer, \"y\" integer) RETURNS bytea LANGUAGE plpgsql STRICT STABLE PARALLEL
    SAFE AS $$\nDECLARE\n  mvt bytea;\n  bounds extensions.geometry;\nBEGIN\n   --
    Guard against invalid zoom levels causing ST_TileEnvelope to overflow\n  IF z
    < 0 OR z > 24 THEN\n      RETURN NULL;\n  END IF;\n      \n  bounds := ST_TileEnvelope(z,
    x, y);\n      \n  WITH tile AS (\n    SELECT \n        pg.feature_id AS id,\n
    \       -- Clip the geometry to the tile boundary for performance\n        ST_AsMVTGeom(ST_Transform(pg.geom_web,
    3857), bounds, 4096, 256, true) AS geom\n    FROM \n        core.parcels p\n    JOIN\n
    \       geo.parcel_geometry pg ON p.parcel_id = pg.parcel_id\n    WHERE \n        p.is_voided
    = false AND\n        pg.legal_valid_range @> NOW() AND\n        ST_Intersects(pg.geom_web,
    ST_Transform(bounds, 4326))\n  )\n  SELECT ST_AsMVT(tile, 'parcels', 4096, 'geom',
    'id')\n  INTO mvt\n  FROM tile;\n  RETURN mvt;\nEND;\n$$;\n-- Create \"improvements\"
    table\nCREATE TABLE \"core\".\"improvements\" (\n  \"improvement_id\" bigint NOT
    NULL GENERATED ALWAYS AS IDENTITY,\n  \"public_id\" uuid NOT NULL DEFAULT gen_random_uuid(),\n
    \ \"legacy_id\" text NULL,\n  \"is_voided\" boolean NOT NULL DEFAULT false,\n
    \ \"voided_at\" timestamptz NULL,\n  \"system_updated_at\" timestamptz NOT NULL
    DEFAULT now(),\n  \"trace_id\" character varying(32) NOT NULL,\n  PRIMARY KEY
    (\"improvement_id\"),\n  CONSTRAINT \"chk_voided_logic\" CHECK (((is_voided =
    false) AND (voided_at IS NULL)) OR ((is_voided = true) AND (voided_at IS NOT NULL)))\n);\n--
    Create index \"idx_improvements_legacy_id\" to table: \"improvements\"\nCREATE
    UNIQUE INDEX \"idx_improvements_legacy_id\" ON \"core\".\"improvements\" (\"legacy_id\");\n--
    Create index \"idx_improvements_public_id\" to table: \"improvements\"\nCREATE
    UNIQUE INDEX \"idx_improvements_public_id\" ON \"core\".\"improvements\" (\"public_id\");\n--
    Create \"parcel_improvements\" table\nCREATE TABLE \"core\".\"parcel_improvements\"
    (\n  \"parcel_improvement_id\" bigint NOT NULL GENERATED ALWAYS AS IDENTITY,\n
    \ \"parcel_id\" bigint NOT NULL,\n  \"improvement_id\" bigint NOT NULL,\n  \"is_primary\"
    boolean NOT NULL DEFAULT false,\n  \"legal_valid_range\" tstzrange NOT NULL,\n
    \ \"system_updated_at\" timestamptz NOT NULL DEFAULT now(),\n  \"trace_id\" character
    varying(32) NOT NULL,\n  PRIMARY KEY (\"parcel_improvement_id\"),\n  CONSTRAINT
    \"no_overlapping_improvements\" EXCLUDE USING GIST (\"improvement_id\" WITH =,
    \"legal_valid_range\" WITH &&),\n  CONSTRAINT \"no_overlapping_primary_improvements\"
    EXCLUDE USING GIST (\"parcel_id\" WITH =, \"legal_valid_range\" WITH &&) WHERE
    (is_primary = true),\n  CONSTRAINT \"fk_improvement_id\" FOREIGN KEY (\"improvement_id\")
    REFERENCES \"core\".\"improvements\" (\"improvement_id\") ON UPDATE NO ACTION
    ON DELETE RESTRICT,\n  CONSTRAINT \"fk_parcel_id\" FOREIGN KEY (\"parcel_id\")
    REFERENCES \"core\".\"parcels\" (\"parcel_id\") ON UPDATE NO ACTION ON DELETE
    RESTRICT\n);\n-- Create index \"idx_parcel_improvements_improvement_id\" to table:
    \"parcel_improvements\"\nCREATE INDEX \"idx_parcel_improvements_improvement_id\"
    ON \"core\".\"parcel_improvements\" (\"improvement_id\");\n-- Create index \"idx_parcel_improvements_parcel_id\"
    to table: \"parcel_improvements\"\nCREATE INDEX \"idx_parcel_improvements_parcel_id\"
    ON \"core\".\"parcel_improvements\" (\"parcel_id\");\n-- Create \"get_primary_improvements\"
    function\nCREATE FUNCTION \"core\".\"get_primary_improvements\" (\"parcel_ids\"
    bigint[], \"target_time\" timestamptz) RETURNS TABLE (\"parcel_id\" bigint, \"improvement_id\"
    bigint) LANGUAGE plpgsql STABLE PARALLEL SAFE AS $$\nBEGIN\n  RETURN QUERY\n  SELECT
    \n    sub.parcel_id, \n    sub.improvement_id\n  FROM (\n    SELECT \n      pi.parcel_id,\n
    \     pi.improvement_id,\n      ROW_NUMBER() OVER (\n        PARTITION BY pi.parcel_id
    \n        ORDER BY \n          pi.is_primary DESC, \n          COALESCE(ia.area_sq_m,
    0.0) DESC, \n          pi.improvement_id ASC\n      ) as rn\n    FROM \n      core.parcel_improvements
    pi\n    LEFT JOIN \n      geo.improvement_attributes ia ON pi.improvement_id =
    ia.improvement_id \n      AND ia.legal_valid_range @> target_time\n    WHERE \n
    \     pi.parcel_id = ANY(parcel_ids)\n      AND pi.legal_valid_range @> target_time\n
    \ ) AS sub\n  WHERE \n    sub.rn = 1;\nEND;\n$$;\n-- Create \"prevent_history_tampering\"
    function\nCREATE FUNCTION \"core\".\"prevent_history_tampering\" () RETURNS trigger
    LANGUAGE plpgsql AS $$\nBEGIN\n  RAISE EXCEPTION 'TAMPER ALERT: History tables
    are immutable, append-only ledgers. UPDATE, DELETE, and TRUNCATE operations are
    strictly forbidden.';\n  RETURN NULL;\nEND;\n$$;\n-- Create \"record_address_attributes_history\"
    function\nCREATE FUNCTION \"core\".\"record_address_attributes_history\" () RETURNS
    trigger LANGUAGE plpgsql SECURITY DEFINER AS $$\nDECLARE\n  current_transaction_time
    timestamptz := now();\nBEGIN\n  IF (TG_OP = 'UPDATE' OR TG_OP = 'DELETE') THEN\n
    \   INSERT INTO address_attributes_history (\n      address_attribute_id,\n      address_id,\n
    \     country_id,\n      administrative_area_id,\n      locality,\n      sublocality,\n
    \     postal_code,\n      address_line_1,\n      address_line_2,\n      address_line_3,\n
    \     formatted_address,\n      coordinates,\n      legal_valid_range,\n      system_valid_range,\n
    \     trace_id\n    ) VALUES (\n      OLD.address_attribute_id,\n      OLD.address_id,\n
    \     OLD.country_id,\n      OLD.administrative_area_id,\n      OLD.locality,\n
    \     OLD.sublocality,\n      OLD.postal_code,\n      OLD.address_line_1,\n      OLD.address_line_2,\n
    \     OLD.address_line_3,\n      OLD.formatted_address,\n      OLD.coordinates,\n
    \     OLD.legal_valid_range,\n      tstzrange(OLD.system_updated_at, current_transaction_time,
    '[)'),\n      OLD.trace_id\n    );\n  END IF;\n          \n  -- Safely route the
    return pointer\n  IF (TG_OP = 'UPDATE') THEN\n      -- Ensures the record's system
    log is updated for the proper time\n      NEW.system_updated_at = current_transaction_time;\n
    \     RETURN NEW;\n  ELSIF (TG_OP = 'DELETE') THEN\n      RETURN OLD;\n  END IF;\n
    \       \n  RETURN NULL;\nEND;\n$$;\n-- Create \"record_addresses_history\" function\nCREATE
    FUNCTION \"core\".\"record_addresses_history\" () RETURNS trigger LANGUAGE plpgsql
    SECURITY DEFINER AS $$\nDECLARE\n  current_transaction_time timestamptz := now();\nBEGIN\n
    \ IF (TG_OP = 'UPDATE' OR TG_OP = 'DELETE') THEN\n    INSERT INTO addresses_history
    (\n      address_id,\n      public_id,\n      legacy_id,\n      is_voided,\n      voided_at,\n
    \     system_valid_range,\n      trace_id\n    ) VALUES (\n      OLD.address_id,\n
    \     OLD.public_id,\n      OLD.legacy_id,\n      OLD.is_voided,\n      OLD.voided_at,\n
    \     tstzrange(OLD.system_updated_at, current_transaction_time, '[)'),\n      OLD.trace_id\n
    \   );\n  END IF;\n          \n  -- Safely route the return pointer\n  IF (TG_OP
    = 'UPDATE') THEN\n      -- Ensures the record's system log is updated for the
    proper time\n      NEW.system_updated_at = current_transaction_time;\n      RETURN
    NEW;\n  ELSIF (TG_OP = 'DELETE') THEN\n      RETURN OLD;\n  END IF;\n        \n
    \ RETURN NULL;\nEND;\n$$;\n-- Create \"record_improvement_attributes_history\"
    function\nCREATE FUNCTION \"core\".\"record_improvement_attributes_history\" ()
    RETURNS trigger LANGUAGE plpgsql SECURITY DEFINER AS $$\nDECLARE\n  current_transaction_time
    timestamptz := now();\nBEGIN\n  IF (TG_OP = 'UPDATE' OR TG_OP = 'DELETE') THEN\n
    \   INSERT INTO improvement_attributes_history (\n      improvement_attribute_id,\n
    \     improvement_id,\n      address_id,\n      improvement_type_id,\n      improvement_condition_id,\n
    \     improvement_quality_id,\n      area_sq_m,\n      bathrooms,\n      bedrooms,\n
    \     year_built,\n      effective_year_built,\n      depreciation_modifier_override,\n
    \     quality_adjustment_modifier_override,\n      units,\n      properties,\n
    \     legal_valid_range,\n      system_valid_range,\n      trace_id\n    ) VALUES
    (\n      OLD.improvement_attribute_id,\n      OLD.improvement_id,\n      OLD.address_id,\n
    \     OLD.improvement_type_id,\n      OLD.improvement_condition_id,\n      OLD.improvement_quality_id,\n
    \     OLD.area_sq_m,\n      OLD.bathrooms,\n      OLD.bedrooms,\n      OLD.year_built,\n
    \     OLD.effective_year_built,\n      OLD.depreciation_modifier_override,\n      OLD.quality_adjustment_modifier_override,\n
    \     OLD.units,\n      OLD.properties,\n      OLD.legal_valid_range,\n      tstzrange(OLD.system_updated_at,
    current_transaction_time, '[)'),\n      OLD.trace_id\n    );\n  END IF;\n          \n
    \ -- Safely route the return pointer\n  IF (TG_OP = 'UPDATE') THEN\n      -- Ensures
    the record's system log is updated for the proper time\n      NEW.system_updated_at
    = current_transaction_time;\n      RETURN NEW;\n  ELSIF (TG_OP = 'DELETE') THEN\n
    \     RETURN OLD;\n  END IF;\n        \n  RETURN NULL;\nEND;\n$$;\n-- Create \"record_improvement_condition_attributes_history\"
    function\nCREATE FUNCTION \"core\".\"record_improvement_condition_attributes_history\"
    () RETURNS trigger LANGUAGE plpgsql SECURITY DEFINER AS $$\nDECLARE\n  current_transaction_time
    timestamptz := now();\nBEGIN\n  IF (TG_OP = 'UPDATE' OR TG_OP = 'DELETE') THEN\n
    \   INSERT INTO improvement_condition_attributes_history (\n      improvement_condition_attribute_id,\n
    \     improvement_condition_id,\n      name,\n      depreciation_modifier,\n      legal_valid_range,\n
    \     system_valid_range,\n      trace_id\n    ) VALUES (\n      OLD.improvement_condition_attribute_id,\n
    \     OLD.improvement_condition_id,\n      OLD.name,\n      OLD.depreciation_modifier,\n
    \     OLD.legal_valid_range,\n      tstzrange(OLD.system_updated_at, current_transaction_time,
    '[)'),\n      OLD.trace_id\n    );\n  END IF;\n          \n  -- Safely route the
    return pointer\n  IF (TG_OP = 'UPDATE') THEN\n      -- Ensures the record's system
    log is updated for the proper time\n      NEW.system_updated_at = current_transaction_time;\n
    \     RETURN NEW;\n  ELSIF (TG_OP = 'DELETE') THEN\n      RETURN OLD;\n  END IF;\n
    \       \n  RETURN NULL;\nEND;\n$$;\n-- Create \"record_improvement_conditions_history\"
    function\nCREATE FUNCTION \"core\".\"record_improvement_conditions_history\" ()
    RETURNS trigger LANGUAGE plpgsql SECURITY DEFINER AS $$\nDECLARE\n  current_transaction_time
    timestamptz := now();\nBEGIN\n  IF (TG_OP = 'UPDATE' OR TG_OP = 'DELETE') THEN\n
    \   INSERT INTO improvement_conditions_history (\n      improvement_condition_id,\n
    \     public_id,\n      legacy_id,\n      is_voided,\n      voided_at,\n      system_valid_range,\n
    \     trace_id\n    ) VALUES (\n      OLD.improvement_condition_id,\n      OLD.public_id,\n
    \     OLD.legacy_id,\n      OLD.is_voided,\n      OLD.voided_at,\n      tstzrange(OLD.system_updated_at,
    current_transaction_time, '[)'),\n      OLD.trace_id\n    );\n  END IF;\n          \n
    \ -- Safely route the return pointer\n  IF (TG_OP = 'UPDATE') THEN\n      -- Ensures
    the record's system log is updated for the proper time\n      NEW.system_updated_at
    = current_transaction_time;\n      RETURN NEW;\n  ELSIF (TG_OP = 'DELETE') THEN\n
    \     RETURN OLD;\n  END IF;\n        \n  RETURN NULL;\nEND;\n$$;\n-- Create \"record_improvement_geometry_history\"
    function\nCREATE FUNCTION \"core\".\"record_improvement_geometry_history\" ()
    RETURNS trigger LANGUAGE plpgsql SECURITY DEFINER AS $$\nDECLARE\n  current_transaction_time
    timestamptz := now();\nBEGIN\n  IF (TG_OP = 'UPDATE' OR TG_OP = 'DELETE') THEN\n
    \   INSERT INTO improvement_geometry_history (\n      improvement_geometry_id,\n
    \     improvement_id,\n      geom_web,\n      geom_legal,\n      local_horizontal_srid,\n
    \     local_vertical_datum,\n      legal_valid_range,\n      system_valid_range,\n
    \     trace_id\n    ) VALUES (\n      OLD.improvement_geometry_id,\n      OLD.improvement_id,\n
    \     OLD.geom_web,\n      OLD.geom_legal,\n      OLD.local_horizontal_srid,\n
    \     OLD.local_vertical_datum,\n      OLD.legal_valid_range,\n      tstzrange(OLD.system_updated_at,
    current_transaction_time, '[)'),\n      OLD.trace_id\n    );\n  END IF;\n          \n
    \ -- Safely route the return pointer\n  IF (TG_OP = 'UPDATE') THEN\n      -- Ensures
    the record's system log is updated for the proper time\n      NEW.system_updated_at
    = current_transaction_time;\n      RETURN NEW;\n  ELSIF (TG_OP = 'DELETE') THEN\n
    \     RETURN OLD;\n  END IF;\n        \n  RETURN NULL;\nEND;\n$$;\n-- Create \"record_improvement_parties_history\"
    function\nCREATE FUNCTION \"core\".\"record_improvement_parties_history\" () RETURNS
    trigger LANGUAGE plpgsql SECURITY DEFINER AS $$\nDECLARE\n  current_transaction_time
    timestamptz := now();\nBEGIN\n  IF (TG_OP = 'UPDATE' OR TG_OP = 'DELETE') THEN\n
    \   INSERT INTO improvement_parties_history (\n      improvement_party_id,\n      improvement_id,\n
    \     party_id,\n      ownership_share,\n      legal_valid_range,\n      system_valid_range,\n
    \     trace_id\n    ) VALUES (\n      OLD.improvement_party_id,\n      OLD.improvement_id,\n
    \     OLD.party_id,\n      OLD.ownership_share,\n      OLD.legal_valid_range,\n
    \     tstzrange(OLD.system_updated_at, current_transaction_time, '[)'),\n      OLD.trace_id\n
    \   );\n  END IF;\n          \n  -- Safely route the return pointer\n  IF (TG_OP
    = 'UPDATE') THEN\n      -- Ensures the record's system log is updated for the
    proper time\n      NEW.system_updated_at = current_transaction_time;\n      RETURN
    NEW;\n  ELSIF (TG_OP = 'DELETE') THEN\n      RETURN OLD;\n  END IF;\n        \n
    \ RETURN NULL;\nEND;\n$$;\n-- Create \"record_improvement_qualities_history\"
    function\nCREATE FUNCTION \"core\".\"record_improvement_qualities_history\" ()
    RETURNS trigger LANGUAGE plpgsql SECURITY DEFINER AS $$\nDECLARE\n  current_transaction_time
    timestamptz := now();\nBEGIN\n  IF (TG_OP = 'UPDATE' OR TG_OP = 'DELETE') THEN\n
    \   INSERT INTO improvement_qualities_history (\n      improvement_quality_id,\n
    \     public_id,\n      legacy_id,\n      is_voided,\n      voided_at,\n      system_valid_range,\n
    \     trace_id\n    ) VALUES (\n      OLD.improvement_quality_id,\n      OLD.public_id,\n
    \     OLD.legacy_id,\n      OLD.is_voided,\n      OLD.voided_at,\n      tstzrange(OLD.system_updated_at,
    current_transaction_time, '[)'),\n      OLD.trace_id\n    );\n  END IF;\n          \n
    \ -- Safely route the return pointer\n  IF (TG_OP = 'UPDATE') THEN\n      -- Ensures
    the record's system log is updated for the proper time\n      NEW.system_updated_at
    = current_transaction_time;\n      RETURN NEW;\n  ELSIF (TG_OP = 'DELETE') THEN\n
    \     RETURN OLD;\n  END IF;\n        \n  RETURN NULL;\nEND;\n$$;\n-- Create \"record_improvement_quality_attributes_history\"
    function\nCREATE FUNCTION \"core\".\"record_improvement_quality_attributes_history\"
    () RETURNS trigger LANGUAGE plpgsql SECURITY DEFINER AS $$\nDECLARE\n  current_transaction_time
    timestamptz := now();\nBEGIN\n  IF (TG_OP = 'UPDATE' OR TG_OP = 'DELETE') THEN\n
    \   INSERT INTO improvement_quality_attributes_history (\n      improvement_quality_attribute_id,\n
    \     improvement_quality_id,\n      name,\n      quality_adjustment_modifier,\n
    \     legal_valid_range,\n      system_valid_range,\n      trace_id\n    ) VALUES
    (\n      OLD.improvement_quality_attribute_id,\n      OLD.improvement_quality_id,\n
    \     OLD.name,\n      OLD.quality_adjustment_modifier,\n      OLD.legal_valid_range,\n
    \     tstzrange(OLD.system_updated_at, current_transaction_time, '[)'),\n      OLD.trace_id\n
    \   );\n  END IF;\n          \n  -- Safely route the return pointer\n  IF (TG_OP
    = 'UPDATE') THEN\n      -- Ensures the record's system log is updated for the
    proper time\n      NEW.system_updated_at = current_transaction_time;\n      RETURN
    NEW;\n  ELSIF (TG_OP = 'DELETE') THEN\n      RETURN OLD;\n  END IF;\n        \n
    \ RETURN NULL;\nEND;\n$$;\n-- Create \"record_improvement_valuations_history\"
    function\nCREATE FUNCTION \"core\".\"record_improvement_valuations_history\" ()
    RETURNS trigger LANGUAGE plpgsql SECURITY DEFINER AS $$\nDECLARE\n  current_transaction_time
    timestamptz := now();\nBEGIN\n  IF (TG_OP = 'UPDATE' OR TG_OP = 'DELETE') THEN\n
    \   INSERT INTO improvement_valuations_history (\n      improvement_valuation_id,\n
    \     improvement_id,\n      valuation_id,\n      market_value,\n      assessed_value,\n
    \     legal_valid_range,\n      system_valid_range,\n      trace_id\n    ) VALUES
    (\n      OLD.improvement_valuation_id,\n      OLD.improvement_id,\n      OLD.valuation_id,\n
    \     OLD.market_value,\n      OLD.assessed_value,\n      OLD.legal_valid_range,\n
    \     tstzrange(OLD.system_updated_at, current_transaction_time, '[)'),\n      OLD.trace_id\n
    \   );\n  END IF;\n          \n  -- Safely route the return pointer\n  IF (TG_OP
    = 'UPDATE') THEN\n      -- Ensures the record's system log is updated for the
    proper time\n      NEW.system_updated_at = current_transaction_time;\n      RETURN
    NEW;\n  ELSIF (TG_OP = 'DELETE') THEN\n      RETURN OLD;\n  END IF;\n        \n
    \ RETURN NULL;\nEND;\n$$;\n-- Create \"record_improvements_history\" function\nCREATE
    FUNCTION \"core\".\"record_improvements_history\" () RETURNS trigger LANGUAGE
    plpgsql SECURITY DEFINER AS $$\nDECLARE\n  current_transaction_time timestamptz
    := now();\nBEGIN\n  IF (TG_OP = 'UPDATE' OR TG_OP = 'DELETE') THEN\n    INSERT
    INTO improvements_history (\n      improvement_id,\n      public_id,\n      legacy_id,\n
    \     is_voided,\n      voided_at,\n      system_valid_range,\n      trace_id\n
    \   ) VALUES (\n      OLD.improvement_id,\n      OLD.public_id,\n      OLD.legacy_id,\n
    \     OLD.is_voided,\n      OLD.voided_at,\n      tstzrange(OLD.system_updated_at,
    current_transaction_time, '[)'),\n      OLD.trace_id\n    );\n  END IF;\n          \n
    \ -- Safely route the return pointer\n  IF (TG_OP = 'UPDATE') THEN\n      -- Ensures
    the record's system log is updated for the proper time\n      NEW.system_updated_at
